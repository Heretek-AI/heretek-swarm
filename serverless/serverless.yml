# Heretek Swarm Serverless Deployment Configuration
# 
# This Serverless Framework configuration deploys the Heretek Swarm API
# to AWS Lambda with API Gateway, DynamoDB for state storage, and
# EventBridge for scheduled tasks.
#
# Prerequisites:
# - AWS CLI configured with appropriate credentials
# - Serverless Framework installed: npm install -g serverless
# - Python 3.11+ runtime
#
# Deployment:
#   serverless deploy
#
# Removal:
#   serverless remove
#
# Monitoring:
#   serverless logs -f api
#   serverless metrics

service: heretek-swarm

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 1024
  timeout: 30
  logRetentionInDays: 30
  
  # Environment variables
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    SERVICE_NAME: ${self:service}
    
    # Database configuration
    DATABASE_URL: ${ssm:/heretek-swarm/${self:provider.stage}/database-url~true}
    REDIS_URL: ${ssm:/heretek-swarm/${self:provider.stage}/redis-url~true}
    
    # Vector database
    QDRANT_HOST: ${ssm:/heretek-swarm/${self:provider.stage}/qdrant-host~true}
    QDRANT_PORT: ${ssm:/heretek-swarm/${self:provider.stage}/qdrant-port~true}
    
    # Event mesh
    NATS_SERVERS: ${ssm:/heretek-swarm/${self:provider.stage}/nats-servers~true}
    
    # API configuration
    API_KEY: ${ssm:/heretek-swarm/${self:provider.stage}/api-key~true}
    SECRET_KEY: ${ssm:/heretek-swarm/${self:provider.stage}/secret-key~true}
    
    # LLM configuration
    OPENAI_API_KEY: ${ssm:/heretek-swarm/${self:provider.stage}/openai-api-key~true}
    
    # Feature flags
    LOG_LEVEL: ${ssm:/heretek-swarm/${self:provider.stage}/log-level, 'INFO'}
    ENABLE_TRACING: 'true'
    ENABLE_METRICS: 'true'
    RAG_ENABLED: 'true'
  
  # IAM role for Lambda functions
  iam:
    role:
      statements:
        # DynamoDB access
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
          Resource:
            - !GetAtt AgentStateTable.Arn
            - !GetAtt WorkflowStateTable.Arn
            - !GetAtt KnowledgeTable.Arn
            - !GetAtt AgentProfilesTable.Arn
        
        # SSM Parameter Store access
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
            - ssm:GetParametersByPath
          Resource:
            - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/heretek-swarm/*
        
        # Secrets Manager access
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:heretek-swarm/*
        
        # CloudWatch Logs
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource:
            - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-*:*
        
        # X-Ray tracing
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: "*"
        
        # EventBridge
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource:
            - !GetAtt SwarmEventsBus.Arn
        
        # SQS (for async processing)
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt AsyncProcessingQueue.Arn
        
        # S3 (for document storage)
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - !GetAtt DocumentsBucket.Arn
            - !Sub ${DocumentsBucket.Arn}/*
        
        # ElastiCache (Redis) VPC access
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
          Resource: "*"

# VPC configuration for accessing ElastiCache and RDS
# vpc:
#   securityGroupIds:
#     - sg-xxxxxxxxx  # Replace with your security group
#   subnetIds:
#     - subnet-xxxxxxxxx  # Replace with your private subnets
#     - subnet-yyyyyyyyy

# Lambda layers
layers:
  - arn:aws:lambda:${self:provider.region}:898466741470:layer:psycopg2-py311:1  # PostgreSQL adapter
  # Add additional layers as needed

# Custom resources
resources:
  Resources:
    # DynamoDB Tables
    
    # Agent State Table - Stores agent lifecycle states
    AgentStateTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-agent-states
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: agent_id
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: N
        KeySchema:
          - AttributeName: agent_id
            KeyType: HASH
          - AttributeName: timestamp
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: agent-type-index
            KeySchema:
              - AttributeName: agent_type
                KeyType: HASH
              - AttributeName: state
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
    
    # Workflow State Table - Stores workflow execution states
    WorkflowStateTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-workflow-states
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: workflow_id
            AttributeType: S
          - AttributeName: step_id
            AttributeType: S
        KeySchema:
          - AttributeName: workflow_id
            KeyType: HASH
          - AttributeName: step_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: status-index
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: created_at
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
    
    # Knowledge Table - RAG document storage and embeddings metadata
    KnowledgeTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-knowledge
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: doc_id
            AttributeType: S
          - AttributeName: chunk_id
            AttributeType: S
        KeySchema:
          - AttributeName: doc_id
            KeyType: HASH
          - AttributeName: chunk_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: embedding-index
            KeySchema:
              - AttributeName: embedding_hash
                KeyType: HASH
              - AttributeName: score
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
    
    # Agent Profiles Table - Behavior profiling data
    AgentProfilesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-agent-profiles
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: agent_id
            AttributeType: S
          - AttributeName: metric_type
            AttributeType: S
        KeySchema:
          - AttributeName: agent_id
            KeyType: HASH
          - AttributeName: metric_type
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
    
    # EventBridge Event Bus
    SwarmEventsBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:service}-${self:provider.stage}-events
    
    # SQS Queue for async processing
    AsyncProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-async-processing
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600  # 14 days
        ReceiveMessageWaitTimeSeconds: 20
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt AsyncProcessingDLQ.Arn
          maxReceiveCount: 3
    
    # Dead Letter Queue
    AsyncProcessingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-async-processing-dlq
        MessageRetentionPeriod: 1209600
    
    # S3 Bucket for documents
    DocumentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-documents-${AWS::AccountId}
        VersioningConfiguration:
          Status: Enabled
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: TransitionToIA
              Status: Enabled
              Transitions:
                - StorageClass: STANDARD_IA
                  TransitionInDays: 30
            - Id: ExpireOldDocuments
              Status: Enabled
              ExpirationInDays: 365
    
    # API Gateway Domain (optional - for custom domain)
    # ApiDomain:
    #   Type: AWS::ApiGateway::DomainName
    #   Properties:
    #     DomainName: api.heretek-swarm.example.com
    #     EndpointConfiguration:
    #       Types:
    #         - REGIONAL
    #     RegionalCertificateArn: ${ssm:/heretek-swarm/${self:provider.stage}/acm-cert-arn}
    
    # CloudWatch Alarms
    
    # Error Rate Alarm
    ErrorRateAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-error-rate
        AlarmDescription: Lambda error rate exceeds threshold
        MetricName: Errors
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 2
        Threshold: 10
        ComparisonOperator: GreaterThanThreshold
        Dimensions:
          - Name: FunctionName
            Value: !Ref ApiHandlerLambdaFunction
    
    # Duration Alarm
    DurationAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-duration
        AlarmDescription: Lambda duration exceeds threshold
        MetricName: Duration
        Namespace: AWS/Lambda
        Statistic: Average
        Period: 300
        EvaluationPeriods: 2
        Threshold: 25000  # 25 seconds (out of 30s timeout)
        ComparisonOperator: GreaterThanThreshold
        Dimensions:
          - Name: FunctionName
            Value: !Ref ApiHandlerLambdaFunction

# Lambda functions
functions:
  # Main API Handler - handles all API Gateway requests
  api:
    handler: handler.api_handler
    description: Main API Gateway handler for Heretek Swarm
    memorySize: 1024
    timeout: 30
    
    # API Gateway events
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Heretek-Api-Key
            allowCredentials: false
      - http:
          path: /health
          method: GET
          cors: true
      - http:
          path: /ready
          method: GET
          cors: true
    
    # Provisioned concurrency for cold start mitigation
    # provisionedConcurrency: 5
    
    # Reserved concurrency
    reservedConcurrency: 100
    
    # Environment overrides
    environment:
      FUNCTION_NAME: api-handler
      LOG_LEVEL: INFO

  # Async Task Processor - processes SQS messages
  async_processor:
    handler: handler.async_processor
    description: Async task processor for background jobs
    memorySize: 512
    timeout: 300
    
    # SQS trigger
    events:
      - sqs:
          arn: !GetAtt AsyncProcessingQueue.Arn
          batchSize: 10
          maximumBatchingWindow: 5
    
    environment:
      FUNCTION_NAME: async-processor

  # Scheduled Tasks - EventBridge triggers
  swarm_health_check:
    handler: handler.swarm_health_check
    description: Scheduled health check for swarm agents
    memorySize: 256
    timeout: 60
    
    events:
      - eventBridge:
          eventBus: ${self:service}-${self:provider.stage}-events
          schedule: rate(5 minutes)
          input:
            action: health_check
    
    environment:
      FUNCTION_NAME: swarm-health-check

  # Agent State Cleanup - removes expired states
  agent_state_cleanup:
    handler: handler.agent_state_cleanup
    description: Cleanup expired agent states
    memorySize: 256
    timeout: 300
    
    events:
      - eventBridge:
          schedule: rate(1 hour)
          input:
            action: cleanup_states
    
    environment:
      FUNCTION_NAME: agent-state-cleanup

  # RAG Index Optimization - optimizes vector indexes
  rag_index_optimize:
    handler: handler.rag_index_optimize
    description: Optimize RAG vector indexes
    memorySize: 1024
    timeout: 600
    
    events:
      - eventBridge:
          schedule: rate(6 hours)
          input:
            action: optimize_index
    
    environment:
      FUNCTION_NAME: rag-index-optimize

  # Behavior Profile Analyzer - analyzes agent behavior patterns
  behavior_profile_analyzer:
    handler: handler.behavior_profile_analyzer
    description: Analyze agent behavior profiles and detect anomalies
    memorySize: 512
    timeout: 300
    
    events:
      - eventBridge:
          schedule: rate(15 minutes)
          input:
            action: analyze_profiles
    
    environment:
      FUNCTION_NAME: behavior-profile-analyzer

# Custom domain configuration (optional)
# customDomain:
#   domainName: api.heretek-swarm.example.com
#   stage: ${self:provider.stage}
#   createRoute53Record: true
#   certificateArn: ${ssm:/heretek-swarm/${self:provider.stage}/acm-cert-arn}

# Plugins
plugins:
  - serverless-python-requirements
  - serverless-offline  # For local development

# Plugin configurations
custom:
  pythonRequirements:
    dockerizePip: true
    slim: true
    strip: false
    usePoetry: false
    usePipenv: false
    zip: true
    
  # Offline configuration
  offline:
    httpPort: 8000
    lambdaPort: 8001
    prefix: ''
    noPrependStageInUrl: true
    
  # Prune old deployments
  prune:
    automatic: true
    number: 3

# Package configuration
package:
  individually: false
  patterns:
    - '!**/__pycache__'
    - '!**/*.pyc'
    - '!**/.git/*'
    - '!**/.pytest_cache/*'
    - '!**/tests/**'
    - '!**/*.md'
    - '!serverless/**'
    - '!.env*'

# Outputs
outputs:
  ApiGatewayApiUrl:
    Description: API Gateway URL
    Value: !Sub https://${AWS::GatewayRestApiId}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}
    Export:
      Name: ${self:service}-${self:provider.stage}-api-url
  
  AgentStateTableName:
    Description: Agent State DynamoDB Table
    Value: !Ref AgentStateTable
    Export:
      Name: ${self:service}-${self:provider.stage}-agent-state-table
  
  WorkflowStateTableName:
    Description: Workflow State DynamoDB Table
    Value: !Ref WorkflowStateTable
    Export:
      Name: ${self:service}-${self:provider.stage}-workflow-state-table
  
  KnowledgeTableName:
    Description: Knowledge DynamoDB Table
    Value: !Ref KnowledgeTable
    Export:
      Name: ${self:service}-${self:provider.stage}-knowledge-table
  
  AgentProfilesTableName:
    Description: Agent Profiles DynamoDB Table
    Value: !Ref AgentProfilesTable
    Export:
      Name: ${self:service}-${self:provider.stage}-agent-profiles-table
  
  EventsBusName:
    Description: EventBridge Events Bus
    Value: !Ref SwarmEventsBus
    Export:
      Name: ${self:service}-${self:provider.stage}-events-bus
  
  AsyncQueueUrl:
    Description: Async Processing SQS Queue
    Value: !Ref AsyncProcessingQueue
    Export:
      Name: ${self:service}-${self:provider.stage}-async-queue
  
  DocumentsBucketName:
    Description: Documents S3 Bucket
    Value: !Ref DocumentsBucket
    Export:
      Name: ${self:service}-${self:provider.stage}-documents-bucket
