# Promtail configuration for Heretek Swarm log collection
# Scrapes logs from containers and sends to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Log scraping configuration
scrape_configs:
  # Heretek Swarm API logs (stdout JSON)
  - job_name: heretek-swarm
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["heretek-swarm"]
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event: event
            request_id: request_id
            trace_id: trace_id
            agent_id: agent_id
            service: service
            message: message
            duration_ms: duration_ms
            method: method
            path: path
            status_code: status_code
      - labels:
          level:
          service:
          event:
          request_id:
          trace_id:
          agent_id

  # Heretek Swarm logs (file-based)
  - job_name: heretek-swarm-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: heretek-swarm-files
          __path__: /var/log/heretek-swarm/**/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
      - labels:
          level

  # NATS logs
  - job_name: nats
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["heretek-nats"]
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+)\s+(?P<level>\w+)\s+(?P<message>.*)$'
      - labels:
          level

  # PostgreSQL logs
  - job_name: postgres
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["heretek-postgres"]
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*\[(?P<level>\w+)\]\s+(?P<message>.*)$'
      - labels:
          level

  # Redis logs
  - job_name: redis
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["heretek-redis"]
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d+\s+\d+:\d+:\d+)\s+(?P<level>\w+)\s+(?P<message>.*)$'
      - labels:
          level

  # Qdrant logs
  - job_name: qdrant
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["heretek-qdrant"]
    pipeline_stages:
      - json:
          expressions:
            timestamp: ts
            level: level
            message: msg
      - labels:
          level
