# NATS Server Configuration — Heretek Swarm
# =============================================================================
# TLS/mTLS enabled. Server requires client certificates (verify: true).
# Certificates are mounted from the host's certs/ directory.

port: 4222

# HTTP monitoring port — bound to all interfaces so docker healthcheck works
http_port: 8222

jetstream {
    store_dir: "/data"
}

tls {
    cert_file: "/etc/nats/certs/nats-server.crt"
    key_file: "/etc/nats/certs/nats-server.key"
    ca_file:   "/etc/nats/certs/ca.crt"
    verify:    true
    timeout:   5.0
}
