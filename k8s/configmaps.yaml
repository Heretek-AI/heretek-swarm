---
# Redis ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: heretek-swarm
data:
  host: "redis"
  port: "6379"
---
# Qdrant ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant-config
  namespace: heretek-swarm
data:
  host: "http://qdrant:6333"
  grpc-host: "http://qdrant:6334"
---
# API ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: heretek-swarm
data:
  log-level: "INFO"
  environment: "production"
  api-host: "0.0.0.0"
  api-port: "8000"
---
# Dashboard ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: heretek-swarm
data:
  api-url: "http://api:8000"
---
# Autonomous Runtime ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: autonomous-config
  namespace: heretek-swarm
data:
  monitoring-enabled: "true"
  auto-restart-enabled: "true"
  consciousness-enabled: "true"
  rag-enabled: "true"
  log-level: "INFO"
