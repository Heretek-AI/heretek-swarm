---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heretek-swarm-ingress
  namespace: heretek-swarm
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "heretek-swarm-api"
spec:
  tls:
    - hosts:
        - api.heretek-swarm.com
        - dashboard.heretek-swarm.com
      secretName: heretek-swarm-tls
  rules:
    - host: api.heretek-swarm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heretek-swarm-api
                port:
                  number: 8000
    - host: dashboard.heretek-swarm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heretek-swarm-dashboard
                port:
                  number: 80
