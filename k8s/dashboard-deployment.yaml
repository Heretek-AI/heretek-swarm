---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heretek-swarm-dashboard
  namespace: heretek-swarm
  labels:
    app: heretek-swarm-dashboard
    version: "1.0.0"
    environment: production

spec:
  replicas: 2
  selector:
    matchLabels:
      app: heretek-swarm-dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: heretek-swarm-dashboard
        version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      containers:
      - name: dashboard
        image: ghcr.io/heretek-ai/heretek-swarm-dashboard:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 80
            protocol: TCP
        env:
          - name: VITE_API_URL
            valueFrom:
              configMapKeyRef:
                name: dashboard-config
                key: api-url
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
            ephemeral-storage: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: heretek-swarm-dashboard
  namespace: heretek-swarm
  labels:
    app: heretek-swarm-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: heretek-swarm-dashboard
