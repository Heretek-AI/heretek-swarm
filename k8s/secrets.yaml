---
# PostgreSQL Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: heretek-swarm
type: Opaque
stringData:
  username: "heretek"
  password: "${POSTGRES_PASSWORD:-heretek123}"
  database: "heretek_swarm"
  database-url: "postgresql://heretek:${POSTGRES_PASSWORD:-heretek123}@postgres:5432/heretek_swarm"
---
# API Keys Secret
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: heretek-swarm
type: Opaque
stringData:
  openai-api-key: "${OPENAI_API_KEY:-}"
  anthropic-api-key: "${ANTHROPIC_API_KEY:-}"
  qdrant-api-key: "${QDRANT_API_KEY:-}"
---
# Bot Tokens Secret
apiVersion: v1
kind: Secret
metadata:
  name: bot-tokens
  namespace: heretek-swarm
type: Opaque
stringData:
  discord-bot-token: "${DISCORD_BOT_TOKEN:-}"
  telegram-bot-token: "${TELEGRAM_BOT_TOKEN:-}"
  slack-bot-token: "${SLACK_BOT_TOKEN:-}"
  slack-signing-secret: "${SLACK_SIGNING_SECRET:-}"
---
# LiteLLM Secret
apiVersion: v1
kind: Secret
metadata:
  name: litellm-credentials
  namespace: heretek-swarm
type: Opaque
stringData:
  master-key: "${LITELLM_MASTER_KEY:-}"
  salt-key: "${LITELLM_SALT_KEY:-}"
---
# Auth Secret
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: heretek-swarm
type: Opaque
stringData:
  jwt-secret: "${JWT_SECRET:-heretek-swarm-secret-key-change-in-production}"
  api-key: "${API_KEY:-heretek-swarm-api-key-change-in-production}"
