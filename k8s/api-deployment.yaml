apiVersion: apps/v1
kind: Deployment
metadata:
  name: heretek-swarm-api
  namespace: heretek-swarm
  labels:
    app: heretek-swarm-api
    version: "1.0.0"
    environment: production

spec:
  replicas: 3
  selector:
    matchLabels:
      app: heretek-swarm-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: heretek-swarm-api
        version: "1.0.0"
    spec:
      containers:
      - name: api
        image: ghcr.io/heretek-ai/heretek-swarm-api:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8000
            protocol: TCP
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: postgres-credentials
                key: database-url
          - name: REDIS_URL
            valueFrom:
              configMapKeyRef:
                name: redis-config
                key: host
          - name: QDRANT_URL
            valueFrom:
              configMapKeyRef:
                name: qdrant-config
                key: host
          - name: LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: api-config
                key: log-level
          - name: HERETEK_ENV
            valueFrom:
              configMapKeyRef:
                name: api-config
                key: environment
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-keys
                key: openai-api-key
                optional: true
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-keys
                key: anthropic-api-key
                optional: true
          - name: QDRANT_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-keys
                key: qdrant-api-key
                optional: true
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: auth-secret
                key: jwt-secret
          - name: API_KEY
            valueFrom:
              secretKeyRef:
                name: auth-secret
                key: api-key
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
          - name: api-logs
            mountPath: /app/logs
      volumes:
        - name: api-logs
          persistentVolumeClaim:
            claimName: api-logs-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: heretek-swarm-api
  namespace: heretek-swarm
  labels:
    app: heretek-swarm-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: heretek-swarm-api

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-logs-pvc
  namespace: heretek-swarm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
