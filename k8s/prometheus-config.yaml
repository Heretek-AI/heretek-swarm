---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: heretek-swarm
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'heretek-swarm'
        environment: 'production'

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    rule_files:
      - '/etc/prometheus/rules/*.yml'

    scrape_configs:
      # Heretek Swarm API
      - job_name: 'heretek-swarm-api'
        kubernetes_sd_configs:
          - role: pod
          namespaces:
            names:
              - heretek-swarm
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: heretek-swarm-api
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8000

      # Heretek Swarm Dashboard
      - job_name: 'heretek-swarm-dashboard'
        kubernetes_sd_configs:
          - role: pod
          namespaces:
            names:
              - heretek-swarm
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: heretek-swarm-dashboard
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:80

---
# Prometheus Rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: heretek-swarm
data:
  alerts.yml: |
    groups:
      - name: heretek-swarm-api
        rules:
          - alert: APIDown
            expr: up{job="heretek-swarm-api"} == 0
            for: 1m
            labels:
              severity: critical
              component: api
            annotations:
              summary: "Heretek Swarm API is down"
              description: "The API has been down for more than 1 minute."

          - alert: APIHighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
            for: 10m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "High API latency"
              description: "95th percentile latency is above 1 second."
