---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heretek-swarm-autonomous
  namespace: heretek-swarm
  labels:
    app: heretek-swarm-autonomous
    version: "1.0.0"
    environment: production

spec:
  replicas: 1
  selector:
    matchLabels:
      app: heretek-swarm-autonomous
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: heretek-swarm-autonomous
        version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      containers:
      - name: autonomous
        image: ghcr.io/heretek-ai/heretek-swarm-autonomous:1.0.0
        imagePullPolicy: IfNotPresent
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: postgres-credentials
                key: database-url
          - name: REDIS_URL
            valueFrom:
              configMapKeyRef:
                name: redis-config
                key: host
          - name: API_HOST
            valueFrom:
              configMapKeyRef:
                name: api-config
                key: api-host
          - name: API_PORT
            valueFrom:
              configMapKeyRef:
                name: api-config
                key: api-port
          - name: MONITORING_ENABLED
            valueFrom:
              configMapKeyRef:
                name: autonomous-config
                key: monitoring-enabled
          - name: AUTO_RESTART_ENABLED
            valueFrom:
              configMapKeyRef:
                name: autonomous-config
                key: auto-restart-enabled
          - name: CONSCIOUSNESS_ENABLED
            valueFrom:
              configMapKeyRef:
                name: autonomous-config
                key: consciousness-enabled
          - name: RAG_ENABLED
            valueFrom:
              configMapKeyRef:
                name: autonomous-config
                key: rag-enabled
          - name: LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: autonomous-config
                key: log-level
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
            ephemeral-storage: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
