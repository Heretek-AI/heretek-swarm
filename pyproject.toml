[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heretek-swarm"
version = "0.2.0"
description = "Heretek Swarm v2.0 - Next-generation multi-agent system built on Swarms framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Heretek AI", email = "engineering@heretek.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "swarms>=5.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "qdrant-client>=1.7.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "circuitbreaker>=2.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.25.0",
    "websockets>=12.0",
    # mem0 integration for long-term memory
    "mem0ai>=1.0.0",
    # FastAPI for backend API
    "fastapi>=0.109.0",
    # CLI framework
    "click>=8.1.0",
    # Prometheus metrics
    "prometheus-client>=0.19.0",
    # NATS messaging
    "nats-py>=2.0.0",
]

[project.optional-dependencies]
core = [
    # Core swarm framework only
    "swarms>=5.0.0",
    "pydantic>=2.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "circuitbreaker>=2.0.0",
]
agents = [
    "heretek-swarm[core]",
    # Agent framework
    "starlette>=0.27.0",
    "uvicorn>=0.25.0",
    "websockets>=12.0",
    "fastapi>=0.109.0",
    "click>=8.1.0",
    "httpx>=0.25.0",
    # Memory
    "mem0ai>=1.0.0",
    # Vector storage
    "redis>=5.0.0",
    "qdrant-client>=1.7.0",
    # Observability
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
]
postgres = [
    # Postgres-backed event store (optional)
    "asyncpg>=0.29.0",
]
full = [
    "heretek-swarm[agents]",
    # Extended observability
    "opentelemetry-instrumentation-fastapi>=0.53b0",
    "opentelemetry-instrumentation-httpx>=0.53b0",
]
dev = [
    "heretek-swarm[full]",
    # Database drivers (for observability/db_timing tests)
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.12.0",
    "pytest-env>=1.1.0",
    "hypothesis>=6.98.0",
    "faker>=24.0.0",
    # Coverage
    "coverage[toml]>=7.4.0",
    # Code Quality
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    # Load Testing
    "locust>=2.23.0",
    "locust-plugins>=4.0.0",
    # Observability Testing
    "testcontainers>=3.7.0",
]

[project.scripts]
heretek-swarm = "heretek_swarm.cli:cli"

[project.urls]
Homepage = "https://github.com/heretek-ai/heretek-swarm"
Documentation = "https://github.com/heretek-ai/heretek-swarm/tree/main/docs"
Repository = "https://github.com/heretek-ai/heretek-swarm"
Issues = "https://github.com/heretek-ai/heretek-swarm/issues"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["heretek_swarm*"]

# ============== PYTEST CONFIGURATION ==============
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # The AutonomousSwarm's real agent instances create aiohttp.ClientSession
    # objects in background tasks during initialize().  test_deliberation_flow.py
    # terminates the supervisor, but the session GC races with pytest's
    # teardown check on Python 3.14.  This is harmless — sessions are unused
    # in no_infra mode.
    "ignore::ResourceWarning",
]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not integration",
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require external services)",
    "load: Load/performance tests",
    "slow: Tests that take >5s",
    "a2a: Agent-to-Agent messaging tests",
    "consensus: Consensus mechanism tests",
    "latency: Latency benchmark tests (<100ms baseline)",
    "bench: Benchmark tests (pytest-benchmark throughput)",
    "security: Security-focused tests",
]

# ============== COVERAGE CONFIGURATION ==============
[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/site-packages/*",
]
parallel = true
sigterm = true

[tool.coverage.paths]
source = [
    "backend/",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
skip_empty = true
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"
title = "Heretek Swarm Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

# ============== RUFF CONFIGURATION ==============
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EXE",    # flake8-executable
    "FIX",    # flake8-fixme
    "FA",     # flake8-future-annotations
    "INT",    # flake8-gettext
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "TID",    # flake8-tidy-imports
    "T20",    # flake8-print
    "PERF",   # perflint
]
ignore = [
    "S101",   # assert used (needed for tests)
    "COM812", # trailing comma missing (conflicts with formatter)
    "ISC001", # single-line implicit string concatenation (conflicts with formatter)
    "PT011",  # pytest.raises - too broad
    "ARG001", # unused function argument (common in callbacks)
    "S608",   # SQL injection (handled by parameterized queries)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # assert used
    "ARG001", # unused argument
    "ARG002", # unused argument (function)
    "PT019",  # pytest.fixture without value
    "S106",   # hardcoded password (test fixtures)
    "SLF001", # Private member access (tests need to access internals)
]
"backend/heretek_swarm/actors/{alpha,beta,catalyst,charlie,coder,echo,empath,explorer,handoff,handoff_handlers,historian,metis,perceiver,steward}.py" = [
    "F403",   # Re-export stubs use wildcard imports
]

"backend/heretek_swarm/actors/base/state_management.py" = ["E501"]
"backend/heretek_swarm/actors/examiner/__init__.py" = ["E501"]
"backend/heretek_swarm/actors/examiner/agent.py" = ["E501", "E402"]
"backend/heretek_swarm/actors/perceiver_plus/__init__.py" = ["E501"]
"backend/heretek_swarm/api/main.py" = ["E501"]
"backend/heretek_swarm/api/metrics.py" = ["E501"]
"backend/heretek_swarm/api/websockets.py" = ["E501"]
"backend/heretek_swarm/collective/agency_tracking.py" = ["E501"]
"backend/heretek_swarm/collective/distributed_learning.py" = ["E501"]
"backend/heretek_swarm/consciousness/iit_phi.py" = ["E501"]
"backend/heretek_swarm/consensus/maker.py" = ["E501"]
"backend/heretek_swarm/consensus/maker_enhanced.py" = ["E501"]
"backend/heretek_swarm/goals/models.py" = ["E501", "RUF002"]
"backend/heretek_swarm/goals/proposer.py" = ["E501"]
"backend/heretek_swarm/goals/translator.py" = ["E501"]
"backend/heretek_swarm/integrations/anthropic.py" = ["E501"]
"backend/heretek_swarm/integrations/langgraph.py" = ["E501"]
"backend/heretek_swarm/integrations/openai_assistants.py" = ["E501"]
"backend/heretek_swarm/memory/base.py" = ["E501"]
"backend/heretek_swarm/runtime/autonomous_runtime_config.py" = ["E501"]
"backend/heretek_swarm/runtime/scaling.py" = ["E501"]
"backend/heretek_swarm/state/event_store.py" = ["E501"]
"backend/heretek_swarm/state/repository.py" = ["E501"]
"backend/heretek_swarm/utils/lazy_imports.py" = ["E501"]
"tests/test_goal_proposer.py" = ["E501"]
"tests/test_workflow_api.py" = ["E501"]
"tests/test_workflow_llm_node.py" = ["E501"]
"backend/heretek_swarm/goals/consensus.py" = ["RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["heretek_swarm"]
known-third-party = ["pytest", "pydantic", "opentelemetry"]

# ============== MYPY CONFIGURATION ==============
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["tests.*", "tests"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "heretek_swarm.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false
warn_no_return = false
warn_unreachable = false
warn_unused_ignores = false
no_implicit_optional = false
disable_error_code = ["attr-defined", "union-attr", "misc", "assignment", "arg-type", "call-arg", "override", "operator", "index", "var-annotated", "return-value", "valid-type", "import-not-found", "import-untyped", "unused-coroutine", "no-redef", "func-returns-value", "type-var", "truthy-function", "comparison-overlap", "dict-item", "has-type", "literal-required", "name-defined", "no-any-return", "type-arg", "call-overload", "list-item"]

[tool.bandit]
exclude_dirs = [".roo", "agent_workspace", ".benchmarks", ".dist-rig", "tests"]
skips = ["B101", "B601"]
