[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heretek-swarm"
version = "0.1.0"
description = "Heretek Swarm v2.0 - Next-generation multi-agent system built on Swarms framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Heretek AI", email = "engineering@heretek.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "swarms>=5.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "qdrant-client>=1.7.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "circuitbreaker>=2.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.25.0",
    "websockets>=12.0",
    # mem0 integration for long-term memory
    "mem0ai>=1.0.0",
    # FastAPI for backend API
    "fastapi>=0.109.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.12.0",
    "pytest-env>=1.1.0",
    "hypothesis>=6.98.0",
    "faker>=24.0.0",
    
    # Coverage
    "coverage[toml]>=7.4.0",
    
    # Code Quality
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    
    # Load Testing
    "locust>=2.23.0",
    "locust-plugins>=4.0.0",
    
    # Observability Testing
    "testcontainers>=3.7.0",
]

[project.scripts]
heretek-swarm = "src.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["heretek_swarm*"]

# ============== PYTEST CONFIGURATION ==============
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require external services)",
    "load: Load/performance tests",
    "slow: Tests that take >5s",
    "a2a: Agent-to-Agent messaging tests",
    "consensus: Consensus mechanism tests",
    "latency: Latency benchmark tests (<100ms baseline)",
    "security: Security-focused tests",
]

# ============== COVERAGE CONFIGURATION ==============
[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/site-packages/*",
]
parallel = true
sigterm = true

[tool.coverage.paths]
source = [
    "src/",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
skip_empty = true
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"
title = "Heretek Swarm Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

# ============== RUFF CONFIGURATION ==============
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EXE",    # flake8-executable
    "FIX",    # flake8-fixme
    "FA",     # flake8-future-annotations
    "INT",    # flake8-gettext
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "TID",    # flake8-tidy-imports
    "T20",    # flake8-print
    "PERF",   # perflint
]
ignore = [
    "S101",   # assert used (needed for tests)
    "COM812", # trailing comma missing (conflicts with formatter)
    "ISC001", # single-line implicit string concatenation (conflicts with formatter)
    "PT011",  # pytest.raises - too broad
    "ARG001", # unused function argument (common in callbacks)
    "S608",   # SQL injection (handled by parameterized queries)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # assert used
    "ARG001", # unused argument
    "PT019",  # pytest.fixture without value
    "S106",   # hardcoded password (test fixtures)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["pytest", "pydantic", "opentelemetry"]

# ============== MYPY CONFIGURATION ==============
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.bandit]
exclude_dirs = [".roo", "agent_workspace", ".benchmarks", ".dist-rig", "tests"]
skips = ["B101", "B601"]

# ============== PYLINT CONFIGURATION ==============
[tool.pylint.MASTER]
# Files or directories to be skipped
ignore = [".roo", "agent_workspace", ".benchmarks", ".dist-rig", "tests"]
jobs = 0  # Use multiple processes for parallel execution

[tool.pylint.MESSAGES]
# Enable specific error codes
enable = [
    "PYL-E0602",  # Used before assignment (catches underscore prefix issues)
    "W0613",      # Unused argument
    "W0614",      # Unused import from wildcard
    "E1101",      # Instance member not defined (type checking)
    "E1102",      # Not callable
    "E0601",      # Used before assignment
    "W0602",      # Using global for underscore prefix vars
    "R0913",      # Too many arguments
    "R0914",      # Too many local variables
]

[tool.pylint."MESSAGES CONTROL"]
# Disable specific warnings that conflict with other tools
disable = [
    "C0114",  # Missing module docstring (handled by ruff)
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0903",  # Too few public methods
    "W0511",  # Fixme (TODO comments)
    "C0301",  # Line too long (handled by black)
    "C0411",  # Wrong import order (handled by isort)
    "R0801",  # Duplicate code
    "W1514",  # Using open without encoding
]

[tool.pylint.FORMAT]
max-line-length = 100
max-module-lines = 500

[tool.pylint.DESIGN]
max-args = 10
max-locals = 20
max-returns = 6
max-branches = 15
max-statements = 60
max-attributes = 15
max-public-methods = 25

[tool.pylint.TYPECHECK]
# Handle dynamic attributes and methods
generated-members = [
    "requests.*",
    "aiohttp.*",
    "redis.*",
    "qdrant_client.*",
]
ignored-classes = [
    "optparse.Values",
    "thread._local",
    "_thread._local",
]

[tool.pylint.IMPORTS]
# Known third-party modules
known-third-party = [
    "pydantic",
    "opentelemetry",
    "redis",
    "qdrant_client",
    "fastapi",
    "uvicorn",
    "structlog",
    "tenacity",
    "circuitbreaker",
    "mem0ai",
    "swarms",
]

# ============== FLAKE8 CONFIGURATION ==============
[tool.flake8]
max-line-length = 100
extend-ignore = "E203"
exclude = [
    ".roo",
    "agent_workspace",
    ".benchmarks",
    ".dist-rig",
    "tests",
    "__pycache__",
    ".venv",
]
per-file-ignores = [
    "tests/*:S101,ARG001",  # Allow assert and unused args in tests
]
