[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heretek-swarm"
version = "0.1.0"
description = "Heretek Swarm v2.0 - Next-generation multi-agent system built on Swarms framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Heretek AI", email = "engineering@heretek.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "swarms>=5.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "qdrant-client>=1.7.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "circuitbreaker>=2.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.25.0",
    "websockets>=12.0",
    # mem0 integration for long-term memory
    "mem0ai>=1.0.0",
    # FastAPI for backend API
    "fastapi>=0.109.0",
    # Database
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    # Prometheus metrics
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.12.0",
    "pytest-env>=1.1.0",
    "hypothesis>=6.98.0",
    "faker>=24.0.0",
    
    # Coverage
    "coverage[toml]>=7.4.0",
    
    # Code Quality
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    
    # Load Testing
    "locust>=2.23.0",
    "locust-plugins>=4.0.0",
    
    # Observability Testing
    "testcontainers>=3.7.0",
]

[project.scripts]
heretek-swarm = "src.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["heretek_swarm*"]

# ============== PYTEST CONFIGURATION ==============
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require external services)",
    "load: Load/performance tests",
    "slow: Tests that take >5s",
    "a2a: Agent-to-Agent messaging tests",
    "consensus: Consensus mechanism tests",
    "latency: Latency benchmark tests (<100ms baseline)",
    "security: Security-focused tests",
]

# ============== COVERAGE CONFIGURATION ==============
[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/site-packages/*",
]
parallel = true
sigterm = true

[tool.coverage.paths]
source = [
    "src/",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
skip_empty = true
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"
title = "Heretek Swarm Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

# ============== RUFF CONFIGURATION ==============
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EXE",    # flake8-executable
    "FIX",    # flake8-fixme
    "FA",     # flake8-future-annotations
    "INT",    # flake8-gettext
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "TRY",    # tryceratops
    "NPY",    # numpy-specific rules
    "RSE",    # flake8-raise
    "SIM",    # flake8-simplify (redundant)
    "T100",   # flake8-debugger (redundant)
    "DJ",     # flake8-django
    "PGH",    # pygrep-hooks
    "PL",     # pylint
    "PIE",    # flake8-pie (redundant)
    "TRY",    # tryceratops (redundant)
]
ignore = [
    "S101",   # assert (use pytest instead)
    "PLR0913", # too-many-args (有时候需要)
    "PLR2004", # magic-value-comparison (有时候需要)
    "S603",   # subprocess-popen-preexec-fn (安全考虑，但litellm需要)
    "S607",   # start-new-session (同上)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = [
    "S101",   # assert in tests
    "PLR2004", # magic-value-comparison in tests
]
"examples/*" = ["S101", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============== MYPY CONFIGURATION ==============
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "examples.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "swarms.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mem0ai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qdrant_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "structlog.*"
ignore_missing_imports = true

# ============== DEVELOPMENT TOOLS ==============
[tool.hatch.envs.default]
features = []

[tool.hatch.envs.test]
features = ["dev"]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov --cov-report=term-missing --cov-report=html --cov-report=xml {args:tests}"
test-all = "pytest --cov -m 'not slow' {args:tests}"
lint = "ruff check ."
fmt = "ruff format ."

[tool.hatch.envs.lint]
features = ["dev"]

[tool.hatch.envs.lint.scripts]
ruff = "ruff check ."
ruff-fmt = "ruff format ."
mypy = "mypy src/"

# ============== CI/CD CONFIGURATION ==============
[tool.yamlfix]
column_limit = 100
indent_mapping = 2
indent_sequence = true
