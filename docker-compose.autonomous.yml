# Heretek Swarm - Autonomous Runtime Docker Compose
# Full stack for 24/7 continuous operation
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.autonomous.yml up -d
#
# Services:
#   - heretek-swarm (Autonomous runtime)
#   - postgres (Persistent storage)
#   - redis (Ephemeral storage/cache)
#   - qdrant (Vector store)
#   - nats (Event mesh)

version: '3.8'

services:
  # ============================================================================
  # HERETEK SWARM - Autonomous Runtime
  # ============================================================================
  heretek-swarm:
    build:
      context: .
      dockerfile: docker/Dockerfile.autonomous
    container_name: heretek-swarm-autonomous
    restart: unless-stopped
    ports:
      - "8000:8000"   # API Gateway
      - "18789:18789" # A2A Protocol Server
      - "18790:18790" # MCP Server
    environment:
      # Database
      - DATABASE_URL=postgresql://heretek:password@postgres:5432/heretek_swarm
      # Redis
      - REDIS_URL=redis://redis:6379
      # NATS
      - NATS_SERVERS=nats://nats:4222
      # Qdrant
      - QDRANT_URL=http://qdrant:6333
      # API Keys (set via environment or secrets)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Auth
      - JWT_SECRET=${JWT_SECRET:-heretek-swarm-secret-key-change-in-production}
      - API_KEY=${API_KEY:-heretek-swarm-api-key-change-in-production}
      # Feature Flags
      - CONSCIOUSNESS_ENABLED=true
      - RAG_ENABLED=true
      - AUTO_RESTART_ENABLED=true
      # Runtime config
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - swarm_logs:/var/log/heretek-swarm
    networks:
      - heretek-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # POSTGRESQL - Persistent Storage
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: heretek-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=heretek
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=heretek_swarm
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - heretek-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heretek -d heretek_swarm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # REDIS - Ephemeral Storage / Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: heretek-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - heretek-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # QDRANT - Vector Store for RAG
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: heretek-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - heretek-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # NATS - Event Mesh
  # ============================================================================
  nats:
    image: nats:latest
    container_name: heretek-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # Monitoring
    command: -js -m 8222
    volumes:
      - nats_data:/data/nats
    networks:
      - heretek-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  nats_data:
    driver: local
  swarm_logs:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  heretek-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
