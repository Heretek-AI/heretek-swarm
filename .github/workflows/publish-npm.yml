# NOTE: The @heretek-ai npm org must be connected to the GitHub repo via npm's GitHub App.
# Set up at: https://www.npmjs.com/settings/@heretek-ai/secrets
# Add the "Publish" connection for the heretek-swarm repository.
name: Publish NPM Package

on:
  push: { tags: ['v*'] }
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: swarm-dashboard
        run: npm ci

      - name: Build
        working-directory: swarm-dashboard
        run: npm run build

      - name: Publish to npm
        uses: npm/publish@v4
        with:
          working-directory: swarm-dashboard
          access: public
          provenance: true