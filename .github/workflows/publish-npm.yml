# NOTE: For trusted publishing to work, the @heretek-ai npm org must have
# a "Publish" connection to the heretek-swarm repository in npm settings.
# Set up at: https://www.npmjs.com/org/heretek-ai → Settings → Publishing
name: Publish NPM Package

on:
  push: { tags: ['v*'] }
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: swarm-dashboard
        run: npm ci

      - name: Build
        working-directory: swarm-dashboard
        run: npm run build

      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v4
        with:
          package: swarm-dashboard
          access: public
          provenance: true