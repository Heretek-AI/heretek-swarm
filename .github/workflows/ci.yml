name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Bandit Security Scan
        run: |
          pip install bandit[toml]
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt || exit 0
      
      - name: Run Safety Check
        run: |
          pip install safety
          safety check --json || true
          safety check || exit 0

  lint-python:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install ruff mypy
          pip install -e ".[dev]"
      
      - name: Run Ruff
        run: ruff check src/ tests/
      
      - name: Run MyPy
        run: mypy src/ --ignore-missing-imports || exit 0

  lint-frontend:
    name: Frontend Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard/frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: dashboard/frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: dashboard/frontend
        run: npm run lint || exit 0
      
      - name: Run TypeScript check
        working-directory: dashboard/frontend
        run: npm run type-check || exit 0

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_swarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-cov pytest-mock
      
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_swarm
          REDIS_URL: redis://localhost:6379
          QDRANT_URL: http://localhost:6333
        run: |
          pytest tests/ -v --cov=src/ --cov-report=xml --cov-report=html --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: python
          name: codecov-umbrella

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard/frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: dashboard/frontend
        run: npm ci
      
      - name: Run tests
        working-directory: dashboard/frontend
        run: npm test -- --coverage --watchAll=false

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-python, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for CI
        run: |
          cat > .env << 'EOF'
          # Mock env vars for CI - real keys not needed for E2E smoke tests
          POSTGRES_PASSWORD=ci-test-password
          OPENAI_API_KEY=sk-test-ci-key
          OPENAI_BASE_URL=https://api.test.example/v1
          LLM_MODEL=test-model
          EMBEDDING_PROVIDER=openai_compatible
          EMBEDDING_BASE_URL=http://localhost:13305/api/v1
          EMBEDDING_API_KEY=test-embed-key
          EMBEDDING_DIMENSIONS=768
          HERETEK_API_KEY=htsk-ci-test-key
          JWT_SECRET=ci-jwt-secret
          API_KEY=ci-api-key
          QDRANT_HOST=localhost
          QDRANT_PORT=6333
          QDRANT_URL=http://localhost:6333
          NATS_URL=nats://localhost:4222
          ENVIRONMENT=ci
          EOF

      - name: Run E2E compose validation tests
        run: |
          docker compose -f docker-compose.yml config --quiet
          python -m pytest tests/e2e/test_compose_validation.py -v

      - name: Run E2E stack smoke tests
        run: |
          # Unique project name to avoid conflicts when same workflow runs multiple times
          PROJECT_NAME=heretek-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          docker compose -p $PROJECT_NAME --profile autonomous up -d --wait
          docker compose -p $PROJECT_NAME ps
          python -m pytest tests/e2e/test_stack_smoke.py -v --timeout=300
        continue-on-error: false

      - name: Cleanup
        if: always()
        run: |
          PROJECT_NAME=heretek-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          docker compose -p $PROJECT_NAME down -v --remove-orphans || true

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [security-scan, lint-python, lint-frontend, test-python, test-frontend, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: heretekai/heretek-swarm:latest,heretekai/heretek-swarm:${{ github.sha }}
          cache-from: type=registry,ref=heretekai/heretek-swarm:latest
          cache-to: type=inline
      
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard/frontend
          file: ./dashboard/frontend/Dockerfile
          push: true
          tags: heretekai/heretek-swarm-frontend:latest,heretekai/heretek-swarm-frontend:${{ github.sha }}
          cache-from: type=registry,ref=heretekai/heretek-swarm-frontend:latest
          cache-to: type=inline

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/heretek-swarm
            docker-compose pull
            docker-compose up -d
            docker system prune -f
      
      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment to production completed with status: ${{ job.status }}"
