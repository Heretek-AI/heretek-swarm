# Heretek Swarm CI/CD Pipeline
# Agent Gamma - QA and Validation Lead
# Enforces >80% coverage and <100ms latency baseline

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      run_load_tests:
        description: 'Run load tests'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  COVERAGE_THRESHOLD: 80
  LATENCY_BASELINE_MS: 100

jobs:
  # ============== CODE QUALITY ==============
  lint:
    name: Code Quality (Ruff + MyPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system ruff mypy

      - name: Run Ruff linter
        run: ruff check --output-format=github .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run MyPy type checker
        run: mypy src --ignore-missing-imports
        continue-on-error: true

  # ============== SECURITY SCAN ==============
  security:
    name: Security Scan (Bandit + Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Bandit security linter
        uses: tj-actions/bandit@v5
        with:
          targets: src

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ============== UNIT TESTS ==============
  test-unit:
    name: Unit Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python: ['3.11', '3.12']
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            -v \
            --tb=short \
            --cov=src \
            --cov-branch \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            -m "unit" \
            --ignore=tests/integration \
            --ignore=tests/load

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml
          flags: unit
          name: unit-coverage-${{ matrix.python }}
        continue-on-error: true

  # ============== INTEGRATION TESTS ==============
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          pytest tests/integration \
            -v \
            --tb=short \
            --cov=src \
            --cov-branch \
            --cov-report=xml:coverage-integration.xml \
            -m "integration" \
            --timeout=300

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-integration.xml
          flags: integration
          name: integration-coverage
        continue-on-error: true

  # ============== LATENCY BENCHMARKS ==============
  test-latency:
    name: Latency Benchmarks (<100ms baseline)
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run latency benchmark tests
        run: |
          pytest tests/ \
            -v \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-json=benchmark-results.json \
            -m "latency"

      - name: Check latency baseline compliance
        run: |
          python scripts/check_latency_baseline.py benchmark-results.json ${{ env.LATENCY_BASELINE_MS }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  # ============== LOAD TESTS ==============
  test-load:
    name: Load Tests (1,000+ concurrent agents)
    runs-on: ubuntu-latest
    needs: [test-integration]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_load_tests == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run load tests
        run: |
          pytest tests/load \
            -v \
            -m "load" \
            --timeout=600

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: tests/load/results/

  # ============== COVERAGE GATE ==============
  coverage-gate:
    name: Coverage Gate (>80%)
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Generate combined coverage report
        run: |
          pytest tests/ \
            --cov=src \
            --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            --ignore=tests/load

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: combined
          name: combined-coverage
          fail_ci_if_error: true

  # ============== BUILD ==============
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [coverage-gate]
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============== NOTIFY ==============
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, security, test-unit, test-integration, coverage-gate]
    if: failure()
    steps:
      - name: Notify on failure
        run: |
          echo "❌ CI/CD Pipeline failed for ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          # Add notification integration here (Slack, Discord, etc.)
