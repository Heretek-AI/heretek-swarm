# Heretek Swarm CI/CD Pipeline
# Agent Gamma - QA and Validation Lead
# Enforces >80% coverage and <100ms latency baseline

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      run_load_tests:
        description: 'Run load tests'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  COVERAGE_THRESHOLD: 80
  LATENCY_BASELINE_MS: 100

jobs:
  lint:
    name: Code Quality (Ruff + MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv pip install --system ruff mypy
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy src --ignore-missing-imports
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tj-actions/bandit@v5
        with:
          targets: src
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  test-unit:
    name: Unit Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python: ['3.11', '3.12']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install --system -e ".[dev]"
      - run: |
          pytest tests/unit -v --tb=short --cov=src --cov-branch \
            --cov-report=xml:coverage-unit.xml --cov-report=term-missing:skip-covered \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} -m "unit" \
            --ignore=tests/integration --ignore=tests/load
        continue-on-error: true
      - uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml
          flags: unit
          name: unit-coverage-${{ matrix.python }}
        continue-on-error: true

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv pip install --system -e ".[dev]"
      - run: |
          pytest tests/integration -v --tb=short --cov=src --cov-branch \
            --cov-report=xml:coverage-integration.xml --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} -m "integration" \
            --ignore=tests/load
        env:
          REDIS_URL: redis://localhost:6379
        continue-on-error: true
      - uses: codecov/codecov-action@v4
        with:
          files: coverage-integration.xml
          flags: integration
          name: integration-coverage
        continue-on-error: true

  test-latency:
    name: Latency Benchmarks
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv pip install --system -e ".[dev]"
      - run: |
          pytest tests/ -v --benchmark-only --benchmark-autosave \
            --benchmark-json=benchmark-results.json -m "latency"
      - run: python scripts/check_latency_baseline.py benchmark-results.json ${{ env.LATENCY_BASELINE_MS }}
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  test-load:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: [test-integration]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_load_tests == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv pip install --system -e ".[dev]"
      - run: pytest tests/load -v -m "load" --timeout=600
      - uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: tests/load/results/

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv pip install --system -e ".[dev]"
      - run: |
          pytest tests/ --cov=src --cov-branch --cov-report=xml:coverage.xml \
            --cov-report=term --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            --ignore=tests/load
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: combined
          name: combined-coverage
          fail_ci_if_error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [coverage-gate]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
