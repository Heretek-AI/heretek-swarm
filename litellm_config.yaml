# LiteLLM Configuration for Heretek Swarm
# This file provides the configuration for LiteLLM proxy to route to multiple LLM providers

model_list:
  # MiniMax (Primary)
  - model_name: minimax/*
    litellm_params:
      model: minimax/*
      api_key: ${MINIMAX_API_KEY}
      api_base: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
  
  # OpenAI
  - model_name: openai/*
    litellm_params:
      model: openai/*
      api_key: ${OPENAI_API_KEY:-}
  
  # Ollama (Local)
  - model_name: ollama/*
    litellm_params:
      model: ollama/*
      api_key: ${OLLAMA_API_KEY:-dummy}
      api_base: ${OLLAMA_BASE_URL:-http://localhost:11434}
  
  # Z.AI / Claude compatible
  - model_name: zai/*
    litellm_params:
      model: zai/*
      api_key: ${ZAI_API_KEY:-}
      api_base: ${ZAI_BASE_URL:-https://api.z.ai/v1}

  # Local llama.cpp via LM Studio
  - model_name: local/*
    litellm_params:
      model: local/*
      api_key: ${LOCAL_API_KEY:-dummy}
      api_base: ${LOCAL_BASE_URL:-http://localhost:1234/v1}

litellm_settings:
  drop_params: true
  set_verbose: true
  json_logs: false
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

environment_variables:
  MINIMAX_API_KEY: ""
  MINIMAX_BASE_URL: "https://api.minimax.io/v1"
  OPENAI_API_KEY: ""
  OLLAMA_API_KEY: "dummy"
  OLLAMA_BASE_URL: "http://localhost:11434"
  ZAI_API_KEY: ""
  ZAI_BASE_URL: "https://api.z.ai/v1"
  LOCAL_API_KEY: "dummy"
  LOCAL_BASE_URL: "http://localhost:1234/v1"