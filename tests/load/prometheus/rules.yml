# Prometheus Alerting Rules for Heretek Swarm Load Testing
#
# These rules define alerts for performance degradation and system issues
# during load testing.

groups:
  - name: load_test_alerts
    interval: 30s
    rules:
      # Latency alerts
      - alert: HighP95Latency
        expr: http_req_duration{quantile="0.95"} > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency detected"
          description: "p95 latency is {{ $value }}ms (threshold: 100ms)"
      
      - alert: CriticalP95Latency
        expr: http_req_duration{quantile="0.95"} > 200
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical p95 latency detected"
          description: "p95 latency is {{ $value }}ms (threshold: 200ms)"
      
      - alert: HighP99Latency
        expr: http_req_duration{quantile="0.99"} > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High p99 latency detected"
          description: "p99 latency is {{ $value }}ms (threshold: 500ms)"
      
      - alert: CriticalP99Latency
        expr: http_req_duration{quantile="0.99"} > 1000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical p99 latency detected"
          description: "p99 latency is {{ $value }}ms (threshold: 1000ms)"
      
      # Failure rate alerts
      - alert: HighFailureRate
        expr: rate(http_req_failed[1m]) * 100 > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High failure rate detected"
          description: "Failure rate is {{ $value }}% (threshold: 1%)"
      
      - alert: CriticalFailureRate
        expr: rate(http_req_failed[1m]) * 100 > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical failure rate detected"
          description: "Failure rate is {{ $value }}% (threshold: 5%)"
      
      # Endpoint-specific alerts
      - alert: HealthCheckSlow
        expr: health_check_latency_ms{quantile="0.95"} > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Health check endpoint slow"
          description: "Health check p95 latency is {{ $value }}ms (threshold: 50ms)"
      
      - alert: AgentOpsSlow
        expr: agent_ops_latency_ms{quantile="0.95"} > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Agent operations slow"
          description: "Agent ops p95 latency is {{ $value }}ms (threshold: 100ms)"
      
      - alert: MemoryOpsSlow
        expr: memory_ops_latency_ms{quantile="0.95"} > 150
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Memory operations slow"
          description: "Memory ops p95 latency is {{ $value }}ms (threshold: 150ms)"
      
      - alert: ConsensusOpsSlow
        expr: consensus_ops_latency_ms{quantile="0.95"} > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Consensus operations slow"
          description: "Consensus ops p95 latency is {{ $value }}ms (threshold: 300ms)"
      
      # System resource alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"
      
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"
      
      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space detected"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }}"
      
      # Load test specific alerts
      - alert: LoadTestNotRunning
        expr: absent(vus)
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "No load test currently running"
          description: "No k6 virtual users metric detected"
      
      - alert: UnexpectedLoadDrop
        expr: delta(vus[1m]) < -10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Unexpected drop in load test users"
          description: "Virtual users dropped by {{ $value }} in 1 minute"

  - name: recording_rules
    interval: 15s
    rules:
      # Pre-compute common queries for better dashboard performance
      - record: job:http_req_duration:p95
        expr: histogram_quantile(0.95, sum(rate(http_req_duration_bucket[5m])) by (le, job))
      
      - record: job:http_req_duration:p99
        expr: histogram_quantile(0.99, sum(rate(http_req_duration_bucket[5m])) by (le, job))
      
      - record: job:http_req_duration:avg
        expr: avg(rate(http_req_duration_sum[5m]) / rate(http_req_duration_count[5m])) by (job)
      
      - record: job:http_req_failed:rate
        expr: sum(rate(http_req_failed[5m])) by (job)
      
      - record: job:http_reqs:rate
        expr: sum(rate(http_reqs[5m])) by (job)
      
      - record: job:success_rate:percent
        expr: (1 - sum(rate(http_req_failed[5m])) by (job) / sum(rate(http_reqs[5m])) by (job)) * 100
