# Prometheus Configuration for Heretek Swarm Load Testing
# 
# This configuration scrapes metrics from:
# - k6 output (via statsd exporter or direct)
# - Heretek Swarm API
# - Node exporters for system metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'heretek-swarm-load-test'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - localhost:9093

# Rule files for recording rules and alerts
rule_files:
  - "rules.yml"

# Scrape configurations
scrape_configs:
  # k6 metrics via statsd exporter
  - job_name: 'k6-statsd'
    static_configs:
      - targets: ['localhost:9125']
    metrics_path: '/metrics'
    
  # k6 direct output (when using --out option)
  - job_name: 'k6-direct'
    static_configs:
      - targets: ['localhost:6565']
    metrics_path: '/metrics'
    
  # Heretek Swarm API metrics
  - job_name: 'heretek-api'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scheme: 'http'
    
  # Locust metrics (when running with --web-host)
  - job_name: 'locust'
    static_configs:
      - targets: ['localhost:8089']
    metrics_path: '/stats/requests'
    
  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    metrics_path: '/metrics'
    
  # Redis exporter (for memory system metrics)
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['localhost:9121']
    metrics_path: '/metrics'
    
  # PostgreSQL exporter (for persistence metrics)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['localhost:9187']
    metrics_path: '/metrics'
    
  # NATS exporter (for event mesh metrics)
  - job_name: 'nats-exporter'
    static_configs:
      - targets: ['localhost:7777']
    metrics_path: '/metrics'
    params:
      port: ['8222']

# Remote write configuration (optional - for long-term storage)
# remote_write:
#   - url: "http://localhost:9201/write"
#     remote_timeout: 30s
