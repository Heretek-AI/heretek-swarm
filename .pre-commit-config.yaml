# Pre-commit hooks configuration for Heretek Swarm
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Usage:
#   pre-commit run --all-files    # Run all hooks on all files
#   pre-commit run                # Run hooks on staged files only
#   pre-commit run pylint         # Run only pylint
#   pre-commit run flake8         # Run only flake8
#   pre-commit run black          # Run only black
#   pre-commit run isort          # Run only isort
#   pre-commit run check-ast      # Run only Python syntax validation
#
# Hooks included:
#   - check-ast: Validates Python syntax
#   - black: Code formatting
#   - isort: Import sorting
#   - pylint: Type checking (catches PYL-E0602 and other errors)
#   - flake8: Additional linting checks
#   - ruff: Fast linting and formatting
#   - mypy: Static type checking
#   - bandit: Security scanning
#   - And various other quality checks
#
# To skip pre-commit hooks (not recommended):
#   git commit --no-verify -m "message"

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.github/|\.git/|\.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)
      - id: end-of-file-fixer
        exclude: ^(.github/|\.git/|\.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)
      - id: check-yaml
        exclude: ^(.github/|\.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)
      - id: check-json
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python hooks
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.11
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)
      - id: ruff-format
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)

  # Python syntax validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-ast
        name: Validate Python syntax

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports
        args: [--profile=black, --filter-files]
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)

  # Pylint for type checking and code quality
  - repo: https://github.com/pycqa/pylint
    rev: v3.1.0
    hooks:
      - id: pylint
        name: Pylint type checking
        args: [--output-format=colorized]
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)

  # Flake8 for additional linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Flake8 linting
        args: [--max-line-length=100, --extend-ignore=E203]
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - types-redis
          - types-requests
        args: [--ignore-missing-imports, --no-strict-optional]
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/|tests/)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/|tests/)

  # Security hooks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(package-lock.json|pnpm-lock.yaml|yarn.lock|\.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)

  # Frontend hooks
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.57.0
    hooks:
      - id: eslint
        files: \.(ts|tsx|js|jsx)$
        types: [file]
        additional_dependencies:
          - eslint@^8.57.0
          - typescript-eslint@^7.0.0
          - eslint-config-prettier@^9.1.0
          - eslint-plugin-react@^7.34.0
          - eslint-plugin-react-hooks@^4.6.0
        args: [--fix, --max-warnings=0]
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)

  # Markdown hooks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--fix]
        exclude: ^(.roo/|agent_workspace/|\.benchmarks/|\.dist-rig/)

  # Docker hooks
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009]

  # Commit message hooks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
