# Prometheus scrape configuration for Heretek Swarm
# This file configures Prometheus to scrape metrics from the Heretek Swarm API

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: 'heretek-swarm'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "alert_rules.yml"
  # - "recording_rules.yml"

# Scrape configurations
scrape_configs:
  # ============================================================================
  # HERETEK SWARM - Main Application
  # ============================================================================
  - job_name: 'heretek-swarm'
    # Metrics path (default: /metrics)
    metrics_path: '/metrics'
    # Scrape interval for this job
    scrape_interval: 15s
    scrape_timeout: 10s
    # How frequently to resend any pending full scrapes that failed
    resend_delay: 5s
    
    # Override the global definition and override the timeout for the scrape
    # target
    # scrape_timeout is "10s" by default.
    scrape_timeout: 10s
    
    # Static targets (for docker-compose environment)
    static_configs:
      - targets: ['heretek-swarm:8000']
        labels:
          service: 'heretek-swarm'
          environment: 'autonomous'
    
    # Service discovery for Kubernetes (uncomment for K8s deployments)
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces:
    #       names:
    #         - production

  # ============================================================================
  # NATS - Event Mesh Monitoring
  # ============================================================================
  - job_name: 'nats'
    metrics_path: '/varz'
    static_configs:
      - targets: ['nats:8222']
        labels:
          service: 'nats'
    
  # ============================================================================
  # REDIS - Cache Monitoring
  # ============================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
    # Note: For Redis Exporter, use:
    # - job_name: 'redis'
    #   static_configs:
    #     - targets: ['redis-exporter:9121']

  # ============================================================================
  # POSTGRESQL - Database Monitoring
  # ============================================================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
    # Note: For PostgreSQL Exporter, use:
    # - job_name: 'postgres'
    #   static_configs:
    #     - targets: ['postgres-exporter:9187']

  # ============================================================================
  # QDRANT - Vector Store Monitoring
  # ============================================================================
  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          service: 'qdrant'

  # ============================================================================
  # PROMQL INTERNAL METRICS (optional)
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
