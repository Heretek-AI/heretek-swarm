# Heretek Swarm - Full Stack Docker Compose
# Complete local development and deployment stack
#
# Usage:
#   docker compose up              # Core services only
#   docker compose --profile autonomous up -d  # With autonomous runtime
#   docker compose --profile mem0 up           # With Mem0 self-hosted memory
#   docker compose --profile all up -d       # All services
#
# Services:
#   Core:     api, frontend, postgres, redis, qdrant, nats
#   Optional: autonomous, mem0 (with ollama + postgres for mem0)
#
# Environment: All secrets via .env file - never hardcode secrets
services:
  # =============================================================================
  # API Server
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heretek-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: true
    environment:
      - DATABASE_URL=postgresql+asyncpg://heretek:${POSTGRES_PASSWORD}@postgres:5432/heretek_swarm
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - NATS_URL=nats://nats:4222
      - NATS_URL=nats://nats:4222
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDER_MODEL=${EMBEDDER_MODEL}
      - HERETEK_API_KEY=${HERETEK_API_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # Frontend Dashboard
  # =============================================================================
  frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: heretek-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_HOST=${VITE_API_HOST}
      - VITE_API_KEY=${HERETEK_API_KEY}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
    profiles:
      - frontend

  # =============================================================================
  # Autonomous Runtime
  # =============================================================================
  autonomous:
    build:
      context: .
      dockerfile: docker/Dockerfile.autonomous
    container_name: heretek-autonomous
    restart: unless-stopped
    ports:
      - "18789:18789"  # A2A Protocol Server
      - "18790:18790"  # MCP Server
    env_file:
      - path: .env
        required: true
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://heretek:${POSTGRES_PASSWORD}@postgres:5432/heretek_swarm
      # Redis
      - REDIS_URL=redis://redis:6379
      # NATS
      - NATS_SERVERS=nats://nats:4222
      # Qdrant
      - QDRANT_URL=http://qdrant:6333
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      # Auth
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY}
      # Feature Flags
      - CONSCIOUSNESS_ENABLED=true
      - RAG_ENABLED=true
      - AUTO_RESTART_ENABLED=true
      # Runtime
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - swarm_logs:/var/log/heretek-swarm
    networks:
      - default
    # No healthcheck - the running process itself indicates health
    # Autonomous runtime is a long-running loop, not a HTTP service
    profiles:
      - autonomous

  # =============================================================================
  # PostgreSQL with pgvector
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: heretek-postgres
    env_file:
      - path: .env
        required: true
    environment:
      - POSTGRES_USER=heretek
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=heretek_swarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heretek -d heretek_swarm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Redis for pub/sub and caching
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: heretek-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Qdrant Vector Database
  # =============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: heretek-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # =============================================================================
  # NATS Event Mesh with JetStream
  # =============================================================================
  nats:
    image: nats:2.10-alpine
    container_name: heretek-nats
    ports:
      - "4222:4222"   # Client port
      - "8222:8222"   # Monitoring port
      - "6222:6222"   # Cluster port
    environment:
      - NATS_JETSTREAM=enabled
    command:
      - -js
      - -m
      - "8222"
      - -sd
      - /data/jetstream
    volumes:
      - nats_data:/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # =============================================================================
  # Mem0 Self-Hosted Memory (optional)
  # =============================================================================
  mem0-postgres:
    image: pgvector/pgvector:pg16
    container_name: heretek-mem0-postgres
    env_file:
      - path: .env
        required: true
    environment:
      - POSTGRES_USER=mem0
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mem0
    ports:
      - "5433:5432"
    volumes:
      - mem0_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - mem0

  mem0:
    build:
      context: ./mem0_server
      dockerfile: Dockerfile
    container_name: heretek-mem0
    ports:
      - "8888:8000"
    env_file:
      - path: .env
        required: true
    environment:
      # Database - match main.py env var names
      - POSTGRES_HOST=mem0-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mem0
      - POSTGRES_USER=mem0
      - POSTGRES_PASSWORD=${MEM0_POSTGRES_PASSWORD}
      - POSTGRES_COLLECTION_NAME=heretek_swarm_memories
      # Vector store - Qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=heretek_swarm_memories
      # LLM - OpenAI-compatible (any endpoint)
      - LLM_PROVIDER=${MEM0_LLM_PROVIDER}
      - LLM_BASE_URL=${MEM0_LLM_BASE_URL}
      - LLM_MODEL=${MEM0_LLM_MODEL}
      - LLM_API_KEY=${MEM0_LLM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Embedder - External Lemonade server
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - OPENAI_EMBEDDING_URL=${EMBEDDING_BASE_URL}
      - OPENAI_EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDER_MODEL}
    depends_on:
      mem0-postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - mem0

  # =============================================================================
  # Ollama for Mem0 LLM (optional, alternative to external API)
  # =============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: heretek-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - mem0

  ollama-pull:
    image: ollama/ollama:latest
    container_name: heretek-ollama-pull
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "-c"
      "echo 'Pulling Ollama models...' &&"
      "ollama pull llama3.2:latest &&"
      "echo 'Ollama models ready'"
    depends_on:
      ollama:
        condition: service_healthy
    profiles:
      - mem0-init
    networks:
      - default

  # =============================================================================
  # LiteLLM Proxy (Optional)
  # =============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:latest
    container_name: heretek-litellm
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: true
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - EMBEDDING_PROVIDER=openai_compatible
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDER_MODEL=${EMBEDDER_MODEL}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml
    restart: unless-stopped
    networks:
      - default
    profiles:
      - litellm

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  nats_data:
    driver: local
  swarm_logs:
    driver: local
  mem0_postgres_data:
    driver: local
  ollama_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  default:
    name: heretek-swarm
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
