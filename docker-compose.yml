version: "3.8"

x-common-env: &common-env
  HERETEK_LOG_LEVEL: ${HERETEK_LOG_LEVEL:-INFO}
  HERETEK_HOME: /app/heretek_data
  ENVIRONMENT: ${ENVIRONMENT:-development}

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-heretek_swarm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-heretek_swarm}"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333; echo -e \"GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3; grep -q \"200\" <&3'"]
    restart: unless-stopped

  nats:
    image: nats:alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - nats_data:/data
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro,z
      - ./certs:/etc/nats/certs:ro,z
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "nc -z localhost 4222 || exit 1"]
    restart: unless-stopped

  # =============================================================================
  # API Service — 23 spawned agents
  # =============================================================================

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      HERETEK_API_KEY: ${HERETEK_API_KEY:-htsk_your_api_key_here}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:password@postgres:5432/heretek_swarm}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      HERETEK_NATS_URL: ${HERETEK_NATS_URL:-tls://nats:4222}
      HERETEK_MTLS_ENABLED: ${HERETEK_MTLS_ENABLED:-true}
      NATS_TLS_CA_FILE: /etc/nats/certs/ca.crt
      NATS_TLS_CERT_FILE: /etc/nats/certs/agent.crt
      NATS_TLS_KEY_FILE: /etc/nats/certs/agent.key
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_heretek_deploy_2026_random_string}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-heretek-swarm}
      JWT_ISSUER: ${JWT_ISSUER:-heretek-swarm}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.minimax.io/v1}
      LLM_MODEL: ${LLM_MODEL:-MiniMax-M2.7}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://127.0.0.1:13305/api/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-lemonade}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-nomic-embed-text-v2-moe-GGUF}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
    volumes:
      - config_keys:/config
      - ./certs:/etc/nats/certs:ro,z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      nats:
        condition: service_started
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
    restart: unless-stopped

  # =============================================================================
  # Dashboard — React frontend
  # =============================================================================

  dashboard:
    build:
      context: ./swarm-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_API_HOST: ${VITE_API_HOST:-http://localhost:8000}
    ports:
      - "3000:80"
    environment:
      <<: *common-env
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_API_HOST: ${VITE_API_HOST:-http://localhost:8000}
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]

# =============================================================================
# Volumes
# =============================================================================

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  nats_data:
  config_keys:
