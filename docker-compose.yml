version: '3.8'

services:
  # =============================================================================
  # API Server
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://heretek:langfuse@postgres:5432/heretek_swarm
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NATS_SERVERS=nats://nats:4222
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M2.7}
      - EMBEDDING_PROVIDER=openai_compatible
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://192.168.31.18:13305/api/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-lemonade}
      - EMBEDDER_MODEL=${EMBEDDER_MODEL:-nomic-embed-text-v2-moe-GGUF}
      - HERETEK_API_KEY=${HERETEK_API_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      - postgres
      - redis
      - qdrant
      - nats
    volumes:
      - ./src:/app/src
      - ./data:/data
    restart: unless-stopped

  # =============================================================================
  # Frontend Dashboard
  # =============================================================================
  frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_HOST=${VITE_API_HOST:-}
    ports:
      - "3000:80"
    environment:
      - VITE_API_HOST=${VITE_API_HOST:-}
      - VITE_API_KEY=${HERETEK_API_KEY:-}
    depends_on:
      - api
    restart: unless-stopped

  # =============================================================================
  # PostgreSQL with pgvector
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=heretek
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      - POSTGRES_DB=heretek_swarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heretek -d heretek_swarm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Redis for pub/sub and caching
  # =============================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Qdrant Vector Database
  # =============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # NATS Event Mesh (Event Bus for Agent Communication)
  # =============================================================================
  nats:
    image: nats:latest
    ports:
      - "4222:4222"   # Client connection
      - "8222:8222"   # Monitoring/HTTP
      - "6222:6222"   # Cluster port
    command: -js -m 8222
    volumes:
      - nats_data:/data/nats
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # LiteLLM Proxy (Optional)
  # =============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:latest
    ports:
      - "4000:4000"
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M2.7}
      - EMBEDDING_PROVIDER=openai_compatible
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://192.168.31.18:13305/api/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-lemonade}
      - EMBEDDER_MODEL=${EMBEDDER_MODEL:-nomic-embed-text-v2-moe-GGUF}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    restart: unless-stopped
    profiles:
      - litellm

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  nats_data:

networks:
  default:
    name: heretek-swarm